<svg xmlns="http://www.w3.org/2000/svg" width="900" height="235" viewBox="0 0 900 235" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity graph initializing</title>
  <desc id="desc">Run the Update profile activity workflow to generate the contribution graph and Mori verdict.</desc>
  <rect width="900" height="235" rx="14" fill="#0b0d10"/>
  <rect x="1" y="1" width="898" height="233" rx="13" fill="none" stroke="#3b2b4f"/>
  <text x="28" y="31" fill="#9b6fd3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">FIELD ACTIVITY // INITIALIZING</text>
  <text x="450" y="105" text-anchor="middle" fill="#e8dfcf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">run the workflow once to generate the live contribution grid</text>
  <text x="450" y="133" text-anchor="middle" fill="#877c91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Actions → Update profile activity → Run workflow</text>
  <line x1="28" y1="200" x2="872" y2="200" stroke="#3b2b4f"/>
  <text x="28" y="220" fill="#9b6fd3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">/•᷅‎‎•᷄\੭</text>
  <text x="112" y="220" fill="#e8dfcf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">awaiting repository activity.</text>
  <text x="872" y="220" text-anchor="end" fill="#877c91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">daily familiar verdict</text>
</svg>
